# Sahayak Monolithic Unified Deployment: Frontends + FastAPI + SQLite
# Single container, single public service, single port.
#
# Usage:
#   docker compose up --build
#
# Entire application (UI + v0 + API + Docs): http://localhost:8000
#   - Main Web App:       http://localhost:8000/
#   - Executive UI (v0):  http://localhost:8000/v0
#   - API Direct:         http://localhost:8000/v1/
#   - Swagger Docs:       http://localhost:8000/docs
#   - Health Check:       http://localhost:8000/health

services:
  sahayak:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./sahayak.db}
      PORT: ${PORT:-8000}
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-sahayak-production-monolith-deployment-secret-32-chars-min}
      JWT_ISSUER: sahayak-api
      JWT_EXPIRY_MINUTES: 60
      CORS_ORIGINS: "*"
      WELFARE_OFFICER_ID: ${WELFARE_OFFICER_ID:-WO_7742}
      WELFARE_OFFICER_PIN: ${WELFARE_OFFICER_PIN:-9481}
      MEDICAL_OFFICER_ID: ${MEDICAL_OFFICER_ID:-MO_3109}
      MEDICAL_OFFICER_PIN: ${MEDICAL_OFFICER_PIN:-6205}
      ADJUTANT_ID: ${ADJUTANT_ID:-ADJ_102}
      ADJUTANT_PIN: ${ADJUTANT_PIN:-8821}
      BREAK_GLASS_TTL_MINUTES: 15
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
